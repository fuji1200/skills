<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF9F6; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar {
  background: #1C2833; padding: 20pt 40pt;
}
.header-bar h1 {
  color: #FFFFFF; font-size: 32pt; margin: 0;
}
.content {
  padding: 30pt 40pt; display: flex; flex-direction: row; gap: 30pt;
}
.left-col {
  flex: 1;
}
.right-col {
  flex: 1; display: flex; justify-content: center; align-items: center;
}
.gojuon-box {
  background: #1C2833; border-radius: 12pt; padding: 30pt;
  text-align: center;
}
.gojuon-box p {
  color: #FFFFFF; font-size: 48pt; margin: 0;
  letter-spacing: 8pt;
}
.left-col h2 {
  color: #E74C3C; font-size: 22pt; margin: 0 0 15pt 0;
}
.left-col p {
  color: #2C3E50; font-size: 16pt; margin: 0 0 12pt 0;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="header-bar">
  <h1>五十音とは</h1>
</div>
<div class="content">
  <div class="left-col">
    <h2>概要</h2>
    <p>五十音（ごじゅうおん）は、日本語の仮名文字を母音と子音の組み合わせで整理した音節表です。</p>
    <h2>特徴</h2>
    <p>5つの母音と10の子音行から構成され、合計46の基本音節があります。</p>
    <p>平仮名と片仮名の両方に適用される体系的な配列です。</p>
  </div>
  <div class="right-col">
    <div class="gojuon-box">
      <p>あいうえお</p>
    </div>
  </div>
</div>
</body>
</html>
