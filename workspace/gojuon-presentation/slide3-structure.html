<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF9F6; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header-bar {
  background: #1C2833; padding: 20pt 40pt;
}
.header-bar h1 {
  color: #FFFFFF; font-size: 32pt; margin: 0;
}
.content {
  padding: 20pt 40pt; display: flex; justify-content: center;
}
.table-container {
  background: #FFFFFF; border-radius: 8pt; padding: 15pt;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
}
table {
  border-collapse: collapse;
}
th {
  background: #E74C3C; color: #FFFFFF; font-size: 14pt;
  padding: 8pt 12pt; text-align: center;
}
td {
  border: 1pt solid #BDC3C7; font-size: 18pt; padding: 6pt 12pt;
  text-align: center; color: #2C3E50;
}
.vowel-header {
  background: #1C2833; color: #FFFFFF; font-size: 14pt;
}
.row-label {
  background: #ECF0F1; font-weight: bold; font-size: 12pt;
}
</style>
</head>
<body>
<div class="header-bar">
  <h1>五十音表の構造</h1>
</div>
<div class="content">
  <div class="table-container">
    <table>
      <tr>
        <th></th>
        <th class="vowel-header">あ段 (a)</th>
        <th class="vowel-header">い段 (i)</th>
        <th class="vowel-header">う段 (u)</th>
        <th class="vowel-header">え段 (e)</th>
        <th class="vowel-header">お段 (o)</th>
      </tr>
      <tr>
        <td class="row-label">あ行</td>
        <td>あ</td><td>い</td><td>う</td><td>え</td><td>お</td>
      </tr>
      <tr>
        <td class="row-label">か行</td>
        <td>か</td><td>き</td><td>く</td><td>け</td><td>こ</td>
      </tr>
      <tr>
        <td class="row-label">さ行</td>
        <td>さ</td><td>し</td><td>す</td><td>せ</td><td>そ</td>
      </tr>
      <tr>
        <td class="row-label">た行</td>
        <td>た</td><td>ち</td><td>つ</td><td>て</td><td>と</td>
      </tr>
      <tr>
        <td class="row-label">な行</td>
        <td>な</td><td>に</td><td>ぬ</td><td>ね</td><td>の</td>
      </tr>
      <tr>
        <td class="row-label">は行</td>
        <td>は</td><td>ひ</td><td>ふ</td><td>へ</td><td>ほ</td>
      </tr>
      <tr>
        <td class="row-label">ま行</td>
        <td>ま</td><td>み</td><td>む</td><td>め</td><td>も</td>
      </tr>
      <tr>
        <td class="row-label">や行</td>
        <td>や</td><td></td><td>ゆ</td><td></td><td>よ</td>
      </tr>
      <tr>
        <td class="row-label">ら行</td>
        <td>ら</td><td>り</td><td>る</td><td>れ</td><td>ろ</td>
      </tr>
      <tr>
        <td class="row-label">わ行</td>
        <td>わ</td><td></td><td></td><td></td><td>を</td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
