<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.accent-bar {
  height: 8pt; background: #E74C3C;
}
.content {
  padding: 30pt 50pt; display: flex; flex-direction: column; flex: 1;
}
.title {
  color: #FFFFFF; font-size: 36pt; margin: 0 0 25pt 0;
  text-align: center;
}
.summary-grid {
  display: flex; gap: 20pt; flex: 1;
}
.summary-card {
  flex: 1; background: #FFFFFF; border-radius: 10pt; padding: 20pt;
  display: flex; flex-direction: column;
}
.card-number {
  background: #E74C3C; color: #FFFFFF; font-size: 24pt; font-weight: bold;
  width: 40pt; height: 40pt; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  margin-bottom: 12pt;
}
.card-number p { margin: 0; }
.card-title {
  color: #1C2833; font-size: 18pt; font-weight: bold; margin: 0 0 10pt 0;
}
.card-content {
  color: #2C3E50; font-size: 13pt; margin: 0; line-height: 1.6;
}
.footer {
  text-align: center; padding: 20pt;
}
.footer p {
  color: #7F8C8D; font-size: 14pt; margin: 0;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <h1 class="title">まとめ</h1>
  <div class="summary-grid">
    <div class="summary-card">
      <div class="card-number"><p>1</p></div>
      <h2 class="card-title">基本構造</h2>
      <p class="card-content">5母音 × 10子音行 = 46基本音節（欠落音あり）</p>
    </div>
    <div class="summary-card">
      <div class="card-number"><p>2</p></div>
      <h2 class="card-title">拡張音</h2>
      <p class="card-content">濁音20音 + 半濁音5音で音の多様性を実現</p>
    </div>
    <div class="summary-card">
      <div class="card-number"><p>3</p></div>
      <h2 class="card-title">体系的配列</h2>
      <p class="card-content">音韻論的に整理された表で学習効率が高い</p>
    </div>
    <div class="summary-card">
      <div class="card-number"><p>4</p></div>
      <h2 class="card-title">実用性</h2>
      <p class="card-content">辞書順・入力方式の基盤として広く活用</p>
    </div>
  </div>
</div>
<div class="footer">
  <p>五十音は日本語学習の基礎であり、言語の体系を理解する鍵です</p>
</div>
</body>
</html>
